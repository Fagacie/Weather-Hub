<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>About — WeatherHub</title>
  <meta name="description" content="Learn more about WeatherHub and get in touch with us.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav-glass" id="mainNav">
    <div class="nav-inner">
      <a class="nav-brand" href="index.html">
        <span class="nav-brand-icon"><i class="bi bi-cloud-sun-fill"></i></span>
        <span class="translatable">WeatherHub</span>
      </a>

      <ul class="nav-links" id="navLinks">
        <li><a class="translatable" href="index.html">Home</a></li>
        <li><a class="translatable" href="map.html">Map</a></li>
        <li id="loginNavItem"><a class="translatable" href="login.html">Login</a></li>
        <li><a class="active translatable" href="about.html">About</a></li>
      </ul>

      <div class="nav-right">
        <select id="languageSelect" class="nav-select" aria-label="Language">
          <option value="en" selected>English</option>
        </select>

        <div class="profile-dropdown" id="profileNavItem" style="display:none;">
          <div class="profile-avatar" id="profileDropdown" tabindex="0" role="button" aria-label="Profile menu" aria-expanded="false">
            <i class="bi bi-person"></i>
          </div>
          <div class="profile-menu" id="profileMenu">
            <a class="translatable" href="profile.html">Profile</a>
            <div class="profile-menu-divider"></div>
            <a class="translatable" href="#" id="logoutMenuBtn">Logout</a>
          </div>
        </div>

        <button class="nav-hamburger" id="navHamburger" aria-label="Toggle menu">
          <i class="bi bi-list"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- About Content -->
  <div class="page-container" style="display:flex;justify-content:center;min-height:80vh;align-items:center;">
    <div class="glass about-card animate-fade-in-up" style="padding:2.5rem 2rem;">
      <h1 class="translatable" style="font-size:1.5rem;font-weight:700;margin-bottom:1rem;">About WeatherHub</h1>
      <p class="translatable" style="color:var(--text-secondary);line-height:1.7;margin-bottom:1.5rem;">
        WeatherHub is a modern platform for real-time weather, forecasts, and more. Our mission is to make weather information accessible, fun, and useful for everyone.
      </p>

      <h2 class="translatable" style="font-size:1.1rem;font-weight:600;margin-bottom:1rem;">Contact Us</h2>
      <form id="contactForm">
        <div class="form-group">
          <label for="contactName" class="form-label translatable">Name</label>
          <input type="text" class="form-input" id="contactName" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label for="contactEmail" class="form-label translatable">Email</label>
          <input type="email" class="form-input" id="contactEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="contactMsg" class="form-label translatable">Message</label>
          <textarea class="form-input" id="contactMsg" rows="3" placeholder="Your message..." required style="resize:vertical;min-height:80px;"></textarea>
        </div>
        <button type="submit" class="btn-primary translatable" style="width:100%;padding:0.75rem;">
          <i class="bi bi-send"></i> Send Message
        </button>
        <div id="contactFormMsg" class="auth-msg"></div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/translate.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof initTranslation === 'function') initTranslation();
      initNav();

      // Contact form handler
      document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var msg = document.getElementById('contactFormMsg');
        var name = document.getElementById('contactName').value.trim();
        var email = document.getElementById('contactEmail').value.trim();
        var message = document.getElementById('contactMsg').value.trim();

        if (!name || !email || !message) {
          msg.textContent = 'Please fill in all fields.';
          msg.className = 'auth-msg error';
          return;
        }

        // Simulate sending (no backend configured)
        msg.textContent = 'Sending...';
        msg.className = 'auth-msg';

        setTimeout(function() {
          msg.textContent = 'Thank you, ' + name + '! Your message has been received. We\'ll get back to you soon.';
          msg.className = 'auth-msg success';
          document.getElementById('contactForm').reset();
        }, 800);
      });
    });

    // Navbar scroll effect
    window.addEventListener('scroll', function() {
      var nav = document.getElementById('mainNav');
      if (window.scrollY > 20) nav.classList.add('scrolled');
      else nav.classList.remove('scrolled');
    });
  </script>
</body>
</html>
