<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>About | Weather Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #ACB6E5 0%, #74ebd5 100%);
      min-height: 100vh;
    }
    .about-card {
      background: rgba(255,255,255,0.85);
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(31,38,135,0.18);
      padding: 2.5rem 2rem;
      max-width: 650px;
      margin: 2rem auto;
    }
    @media (max-width: 767px) {
      .about-card {
        padding: 1.2rem 0.7rem;
        max-width: 98vw;
      }
    }
    .weather-navbar {
      background: #eaeaea !important;
      box-shadow: none;
      border-bottom: none;
    }
    .weather-navbar .navbar-brand,
    .weather-navbar .navbar-brand i {
      color: #42a5f5 !important;
      font-weight: bold;
      font-size: 2rem;
      letter-spacing: 1px;
      background: none !important;
      -webkit-text-fill-color: #42a5f5 !important;
      text-shadow: none !important;
    }
    .navbar-nav .nav-link.active {
      font-weight: bold;
      color: #42a5f5 !important;
      background: #f4f4f4;
      border-radius: 8px 8px 0 0;
      border-bottom: 2px solid #42a5f5;
      text-decoration: none;
    }
    .navbar-nav .nav-link {
      color: #5a5a5a !important;
      font-weight: 500;
      margin-right: 0.5rem;
      transition: background 0.2s, color 0.2s;
      border-radius: 8px;
      padding: 0.5rem 1rem;
    }
    .navbar-nav .nav-link:hover {
      background: #f4f4f4;
      color: #42a5f5 !important;
      text-decoration: none;
    }
    .navbar-nav .dropdown-toggle .bi-person {
      font-size: 1.5rem;
      line-height: 32px;
    }
    #languageSelect {
      background: #fff;
      border-radius: 8px;
      border: none;
      padding: 0.25rem 1rem;
      font-weight: 500;
      color: #5a5a5a;
    }
  </style>
</head>
<body>
 
  <nav class="navbar navbar-expand-lg mb-4 weather-navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-cloud-sun-fill me-2"></i>
        <span class="translatable">WeatherHub</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav align-items-center">
          <li class="nav-item"><a class="nav-link translatable" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link translatable" href="map.html">Map</a></li>
          <li class="nav-item" id="loginNavItem"><a class="nav-link translatable" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link active translatable" href="about.html">About</a></li>
          <li class="nav-item ms-3">
            <select id="languageSelect" class="form-select" style="min-width:120px;">
              <option value="en" selected>English</option>
            </select>
          </li>
          <li class="nav-item ms-3 dropdown" id="profileNavItem" style="display:none;">
            <a href="#" class="nav-link dropdown-toggle" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
              <span class="rounded-circle d-inline-block" style="width:32px;height:32px;background:#6d6464;">
                <i class="bi bi-person text-white" style="font-size:1.5rem;line-height:32px;"></i>
              </span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
              <li><a class="dropdown-item translatable" href="profile.html">Profile</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item translatable" href="#" id="logoutMenuBtn">Logout</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- About Content -->
  <div class="container d-flex justify-content-center align-items-center" style="min-height:70vh;">
    <div class="about-card w-100">
      <h2 class="mb-3 translatable">About Weather Hub</h2>
      <p class="translatable">
        Weather Hub is a modern platform for real-time weather, forecasts, and more. Our mission is to make weather information accessible, fun, and useful for everyone.
      </p>
      <h4 class="mt-4 mb-3 translatable">Contact Us</h4>
      <form>
        <div class="mb-3">
          <label for="contactName" class="form-label translatable">Name</label>
          <input type="text" class="form-control" id="contactName" required>
        </div>
        <div class="mb-3">
          <label for="contactEmail" class="form-label translatable">Email</label>
          <input type="email" class="form-control" id="contactEmail" required>
        </div>
        <div class="mb-3">
          <label for="contactMsg" class="form-label translatable">Message</label>
          <textarea class="form-control" id="contactMsg" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary px-4 translatable">Send</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/translate.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof initTranslation === 'function') initTranslation();
      initNav();
    });
  </script>
</body>
</html>
