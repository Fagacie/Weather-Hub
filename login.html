<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In — WeatherHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="auth-bg">
  <a href="/index.html" class="auth-back"><i class="bi bi-arrow-left"></i> Back</a>
  <div class="auth-card animate-fade-in-up">
    <div class="auth-logo"><i class="bi bi-cloud-sun-fill"></i></div>
    <h1 class="auth-title translatable">Sign In</h1>
    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="loginEmail" class="form-label translatable">Email address</label>
        <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="loginPassword" class="form-label translatable">Password</label>
        <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary translatable" style="width:100%;padding:0.75rem;margin-top:0.5rem;">Login</button>
      <div id="loginMsg" class="auth-msg"></div>
      <div class="auth-link"><a href="/register.html" class="translatable">Don't have an account? Register</a></div>
    </form>
  </div>
  <script type="module" src="/src/pages/login.js"></script>
</body>
</html>
