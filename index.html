<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WeatherHub — Home</title>
  <meta name="description" content="Real-time weather, forecasts, and world capitals weather at a glance.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <div id="nav-mount"></div>

  <div id="loaderOverlay"><div class="loader-spinner"></div></div>
  <div id="toastContainer"></div>

  <div class="page-container">
    <div class="weather-grid">
      <div class="animate-fade-in-up">
        <div class="glass weather-hero">
          <button class="btn-refresh" id="refreshWeatherBtn" title="Refresh weather" aria-label="Refresh weather">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
          <div class="weather-location">
            <i class="bi bi-geo-alt"></i>
            <span id="locationName" class="translatable">Loading location...</span>
          </div>
          <div id="animatedWeatherIcon"></div>
          <div class="weather-temp-display translatable" id="weatherTemp">--</div>
          <div class="weather-desc translatable" id="weatherMain">--</div>
          <div class="weather-date translatable" id="weatherDate">--</div>
          <figure class="weather-gif" id="weatherGif" hidden>
            <img id="weatherGifImg" alt="" loading="lazy" decoding="async">
            <figcaption>
              <a href="https://giphy.com/" target="_blank" rel="noopener noreferrer">Powered by GIPHY</a>
            </figcaption>
          </figure>
        </div>

        <div class="glass fun-fact-card animate-fade-in-up animate-delay-1" id="funFactCard">
          <i class="bi bi-lightbulb-fill"></i>
          <span id="funFactText">Loading fun fact...</span>
        </div>

        <div class="glass capitals-section animate-fade-in-up animate-delay-2">
          <div class="capitals-header">
            <i class="bi bi-globe"></i>
            <span class="translatable">World Capitals Weather</span>
            <span id="capitalsCount" class="capitals-count"></span>
          </div>
          <input type="text" id="capitalSearch" class="capitals-search" placeholder="Search capital or country...">
          <div id="nearbyPlaces"></div>
        </div>
      </div>

      <div class="animate-fade-in-up animate-delay-1">
        <div class="glass forecast-section">
          <div class="forecast-tabs" id="forecastTabs" role="tablist">
            <button class="forecast-tab active translatable" id="now-tab" data-tab="now" type="button" role="tab">Now</button>
            <button class="forecast-tab translatable" id="hourly-tab" data-tab="hourly" type="button" role="tab">24-hour</button>
            <button class="forecast-tab translatable" id="daily-tab" data-tab="daily" type="button" role="tab">5-day</button>
          </div>
          <div class="tab-pane active" id="now" role="tabpanel">
            <div class="now-stats">
              <div class="now-stat-row"><i class="bi bi-thermometer-half"></i><span class="stat-label translatable">Real Feel</span><span class="stat-value" id="realFeel">--</span></div>
              <div class="now-stat-row"><i class="bi bi-wind"></i><span class="stat-label translatable">Wind</span><span class="stat-value" id="windSpeed">--</span></div>
              <div class="now-stat-row"><i class="bi bi-cloud-drizzle"></i><span class="stat-label translatable">Chance of rain</span><span class="stat-value" id="rainChance">--</span></div>
              <div class="now-stat-row"><i class="bi bi-brightness-high"></i><span class="stat-label translatable">UV Index</span><span class="stat-value" id="uvIndex">--</span></div>
            </div>
          </div>
          <div class="tab-pane" id="hourly" role="tabpanel"><div id="hourlyForecast" class="hourly-scroll"></div></div>
          <div class="tab-pane" id="daily" role="tabpanel"><div id="forecastIcons" class="daily-forecast"></div></div>
        </div>

        <div class="glass weather-alert-card animate-fade-in-up animate-delay-2" id="weatherAlertCard" style="display:none;margin-top:1rem;">
          <div class="alert-header"><i class="bi bi-exclamation-triangle-fill"></i><span class="translatable">Weather Alert</span></div>
          <div id="weatherAlertContent"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="capitalModal">
    <div class="modal-card">
      <div class="modal-header">
        <h5 class="translatable">Capital Weather Details</h5>
        <button type="button" class="modal-close" id="capitalModalClose" aria-label="Close"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="modal-body" id="capitalModalBody"></div>
    </div>
  </div>

  <script type="module" src="/src/pages/home.js"></script>
</body>
</html>
