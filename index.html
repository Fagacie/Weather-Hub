<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WeatherHub — Real-Time Weather Dashboard</title>
  <meta name="description" content="WeatherHub provides real-time weather data, forecasts, and world capitals weather in a premium dashboard experience.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ NAVIGATION ============ -->
  <nav class="nav-glass" id="mainNav">
    <div class="nav-inner">
      <a class="nav-brand" href="index.html">
        <span class="nav-brand-icon"><i class="bi bi-cloud-sun-fill"></i></span>
        <span class="translatable">WeatherHub</span>
      </a>

      <ul class="nav-links" id="navLinks">
        <li><a class="active translatable" href="index.html">Home</a></li>
        <li><a class="translatable" href="map.html">Map</a></li>
        <li id="loginNavItem"><a class="translatable" href="login.html">Login</a></li>
        <li><a class="translatable" href="about.html">About</a></li>
      </ul>

      <div class="nav-right">
        <select id="languageSelect" class="nav-select" aria-label="Language">
          <option value="en" selected>English</option>
        </select>

        <button id="themeToggle" class="nav-icon-btn" title="Toggle dark/light mode">
          <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
        </button>

        <div class="profile-dropdown" id="profileNavItem" style="display:none;">
          <div class="profile-avatar" id="profileDropdown" tabindex="0" role="button" aria-label="Profile menu" aria-expanded="false">
            <i class="bi bi-person"></i>
          </div>
          <div class="profile-menu" id="profileMenu">
            <a class="translatable" href="profile.html">Profile</a>
            <div class="profile-menu-divider"></div>
            <a class="translatable" href="#" id="logoutMenuBtn">Logout</a>
          </div>
        </div>

        <button class="nav-hamburger" id="navHamburger" aria-label="Toggle menu">
          <i class="bi bi-list"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- ============ LOADER ============ -->
  <div id="loaderOverlay">
    <div class="loader-spinner"></div>
  </div>

  <!-- ============ TOAST CONTAINER ============ -->
  <div id="toastContainer"></div>

  <!-- ============ MAIN CONTENT ============ -->
  <div class="page-container">
    <div class="weather-grid">

      <!-- ===== LEFT COLUMN ===== -->
      <div class="animate-fade-in-up">

        <!-- Hero Weather Card -->
        <div class="glass weather-hero animate-fade-in-up" id="weatherHeroCard">
          <button class="btn-refresh" id="refreshWeatherBtn" title="Refresh Weather">
            <i class="bi bi-arrow-clockwise"></i>
          </button>

          <div class="weather-location">
            <i class="bi bi-geo-alt-fill"></i>
            <span id="locationName" class="fw-bold translatable">Detecting location...</span>
          </div>

          <div id="animatedWeatherIcon" class="animate-float"></div>

          <div class="weather-desc translatable" id="weatherMain">...</div>
          <div class="weather-temp-display translatable" id="weatherTemp">--°C</div>
          <div class="weather-date translatable" id="weatherDate">...</div>

          <div class="stat-pills">
            <div class="stat-pill">
              <i class="bi bi-thermometer-half"></i>
              <span class="translatable">Feels</span>
              <span id="realFeel">--</span>
            </div>
            <div class="stat-pill">
              <i class="bi bi-wind"></i>
              <span class="translatable">Wind</span>
              <span id="windSpeed">--</span>
            </div>
            <div class="stat-pill">
              <i class="bi bi-cloud-drizzle"></i>
              <span class="translatable">Rain</span>
              <span id="rainChance">--</span>
            </div>
            <div class="stat-pill">
              <i class="bi bi-brightness-high"></i>
              <span class="translatable">UV</span>
              <span id="uvIndex">--</span>
            </div>
          </div>
        </div>

        <!-- Fun Fact Card -->
        <div class="glass fun-fact-card animate-fade-in-up animate-delay-1" id="funFactCard" style="margin-top: 1rem;">
          <i class="bi bi-lightbulb-fill"></i>
          <span id="funFactText">Loading fun fact...</span>
        </div>

        <!-- World Capitals Weather -->
        <div class="glass capitals-section animate-fade-in-up animate-delay-2" style="margin-top: 1rem;">
          <div class="capitals-header">
            <i class="bi bi-globe2"></i>
            <span class="translatable">World Capitals Weather</span>
            <span id="capitalsCount" class="capitals-count"></span>
          </div>
          <input type="text" id="capitalSearch" class="capitals-search" placeholder="Search capital or country...">
          <div id="nearbyPlaces" class="horizontal-scroll"></div>
        </div>
      </div>

      <!-- ===== RIGHT COLUMN ===== -->
      <div class="animate-fade-in-up animate-delay-1">

        <!-- Forecast Card -->
        <div class="glass forecast-section" id="forecastCard">
          <div class="forecast-tabs" id="forecastTabs" role="tablist">
            <button class="forecast-tab active translatable" id="now-tab" role="tab" data-tab="now">Now</button>
            <button class="forecast-tab translatable" id="hourly-tab" role="tab" data-tab="hourly">24-hour</button>
            <button class="forecast-tab translatable" id="daily-tab" role="tab" data-tab="daily">5-day</button>
          </div>

          <div class="tab-pane active" id="now" role="tabpanel">
            <div class="now-stats">
              <div class="now-stat-row">
                <i class="bi bi-thermometer-half"></i>
                <span class="stat-label translatable">Real Feel</span>
                <span class="stat-value" id="realFeelTab">--</span>
              </div>
              <div class="now-stat-row">
                <i class="bi bi-wind"></i>
                <span class="stat-label translatable">Wind</span>
                <span class="stat-value" id="windSpeedTab">--</span>
              </div>
              <div class="now-stat-row">
                <i class="bi bi-cloud-drizzle"></i>
                <span class="stat-label translatable">Chance of rain</span>
                <span class="stat-value" id="rainChanceTab">--</span>
              </div>
              <div class="now-stat-row">
                <i class="bi bi-brightness-high"></i>
                <span class="stat-label translatable">UV Index</span>
                <span class="stat-value" id="uvIndexTab">--</span>
              </div>
            </div>
          </div>

          <div class="tab-pane" id="hourly" role="tabpanel">
            <div id="hourlyForecast" class="hourly-scroll"></div>
          </div>

          <div class="tab-pane" id="daily" role="tabpanel">
            <div id="forecastIcons" class="daily-list"></div>
          </div>
        </div>

        <!-- Air Quality Card (placeholder) -->
        <div class="glass air-quality-card d-none" id="airQualityCard" style="margin-top: 1rem;">
          <i class="bi bi-wind"></i>
          <span id="airQualityText">Air Quality: --</span>
        </div>

        <!-- Weather Alert Card -->
        <div class="glass weather-alert-card animate-fade-in-up" id="weatherAlertCard" style="display:none; margin-top: 1rem;">
          <div class="alert-header">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span class="fw-bold">Weather Alert</span>
          </div>
          <div id="weatherAlertContent"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- ============ CAPITAL DETAILS MODAL ============ -->
  <div class="modal-overlay" id="capitalModal">
    <div class="modal-card">
      <div class="modal-header">
        <h5 class="translatable" id="capitalModalLabel">Capital Weather Details</h5>
        <button class="modal-close" id="capitalModalClose" aria-label="Close">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="modal-body" id="capitalModalBody"></div>
    </div>
  </div>

  <!-- ============ SCRIPTS ============ -->
  <script src="js/config.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/translate.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>

  <script>
    // --- Loader ---
    function showLoader(show) {
      var loader = document.getElementById('loaderOverlay');
      if (show) loader.classList.add('active');
      else loader.classList.remove('active');
    }

    // --- Toast ---
    function showToast(message, type) {
      type = type || 'info';
      var toast = document.createElement('div');
      toast.className = 'toast' + (type === 'error' ? ' toast-error' : type === 'success' ? ' toast-success' : '');
      toast.textContent = message;
      document.getElementById('toastContainer').appendChild(toast);
      setTimeout(function() { toast.style.opacity = 0; toast.style.transform = 'translateX(24px)'; }, 2800);
      setTimeout(function() { toast.remove(); }, 3200);
    }

    // --- Theme Toggle ---
    document.getElementById('themeToggle').onclick = function() {
      document.body.classList.toggle('dark-mode');
      var icon = document.getElementById('themeIcon');
      if (document.body.classList.contains('dark-mode')) {
        icon.classList.remove('bi-moon-stars-fill');
        icon.classList.add('bi-brightness-high-fill');
      } else {
        icon.classList.remove('bi-brightness-high-fill');
        icon.classList.add('bi-moon-stars-fill');
      }
      localStorage.setItem('weatherhub-theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    };
    if (localStorage.getItem('weatherhub-theme') === 'dark') {
      document.body.classList.add('dark-mode');
      document.getElementById('themeIcon').classList.remove('bi-moon-stars-fill');
      document.getElementById('themeIcon').classList.add('bi-brightness-high-fill');
    }

    // --- Custom Tab Switching (no Bootstrap) ---
    document.querySelectorAll('.forecast-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.forecast-tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelectorAll('#forecastCard .tab-pane').forEach(function(p) { p.classList.remove('active'); });
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    });

    // --- Profile Dropdown (no Bootstrap) ---
    var profileDropdown = document.getElementById('profileDropdown');
    var profileMenu = document.getElementById('profileMenu');
    if (profileDropdown && profileMenu) {
      profileDropdown.addEventListener('click', function(e) {
        e.stopPropagation();
        profileMenu.classList.toggle('open');
        profileDropdown.setAttribute('aria-expanded', profileMenu.classList.contains('open'));
      });
      document.addEventListener('click', function() {
        profileMenu.classList.remove('open');
        profileDropdown.setAttribute('aria-expanded', 'false');
      });
    }

    // --- Custom Modal (no Bootstrap) ---
    window.showCapitalModal = function() {
      document.getElementById('capitalModal').classList.add('open');
    };
    window.hideCapitalModal = function() {
      document.getElementById('capitalModal').classList.remove('open');
    };
    document.getElementById('capitalModalClose').addEventListener('click', hideCapitalModal);
    document.getElementById('capitalModal').addEventListener('click', function(e) {
      if (e.target === this) hideCapitalModal();
    });

    // --- Mobile Hamburger ---
    document.getElementById('navHamburger').addEventListener('click', function() {
      document.getElementById('navLinks').classList.toggle('open');
    });

    // --- Navbar scroll effect ---
    window.addEventListener('scroll', function() {
      var nav = document.getElementById('mainNav');
      if (window.scrollY > 20) nav.classList.add('scrolled');
      else nav.classList.remove('scrolled');
    });

    // --- Fun Facts ---
    var funFacts = [
      "Did you know? The highest temperature ever recorded on Earth was 56.7\u00B0C (134\u00B0F) in Death Valley, USA.",
      "Raindrops can fall at speeds of about 22 miles per hour!",
      "Snowflakes always have six sides.",
      "The coldest temperature ever recorded was -89.2\u00B0C (-128.6\u00B0F) in Antarctica.",
      "A bolt of lightning is five times hotter than the surface of the sun.",
      "The wettest place on Earth is Mawsynram, India, with 11,871mm of rain a year.",
      "Hurricanes can release energy equivalent to 10 atomic bombs per second.",
      "The fastest wind speed ever recorded was 253 mph during Tropical Cyclone Olivia.",
      "The Sahara Desert can reach freezing temperatures at night.",
      "Fog is actually a cloud that touches the ground."
    ];
    function setRandomFunFact() {
      document.getElementById('funFactText').textContent = funFacts[Math.floor(Math.random() * funFacts.length)];
    }

    // --- Refresh Weather ---
    document.getElementById('refreshWeatherBtn').onclick = function() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
          getLocationName(pos.coords.latitude, pos.coords.longitude, setLocationName);
          fetchWeatherAndForecast(pos.coords.latitude, pos.coords.longitude);
        });
      }
    };

    // --- Init ---
    document.addEventListener('DOMContentLoaded', function() {
      initTranslation();
      initNav();
      setRandomFunFact();
      document.getElementById('funFactCard').onclick = setRandomFunFact;
      loadHomeWeather();
    });
  </script>
</body>
</html>
