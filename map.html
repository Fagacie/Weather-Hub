<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather Hub | Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    #map { width: 100%; height: 500px; border-radius: 16px; }
    .weather-popup { min-width: 200px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg mb-4 weather-navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-cloud-sun-fill me-2"></i>
        <span class="translatable">WeatherHub</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav align-items-center">
          <li class="nav-item"><a class="nav-link translatable" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active translatable" href="map.html">Map</a></li>
          <li class="nav-item"><a class="nav-link translatable" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link translatable" href="about.html">About</a></li>
          <li class="nav-item ms-3">
            <select id="languageSelect" class="form-select" style="min-width:120px;">
              <option value="en" selected>English</option>
            </select>
          </li>
          <li class="nav-item ms-3 dropdown">
            <a href="#" class="nav-link dropdown-toggle" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
              <span class="rounded-circle d-inline-block" style="width:32px;height:32px;background:#6d6464;">
                <i class="bi bi-person text-white" style="font-size:1.5rem;line-height:32px;"></i>
              </span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
              <li><a class="dropdown-item translatable" href="profile.html">Profile</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item translatable" href="#" id="logoutMenuBtn">Logout</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mb-4">
    <h2 class="mb-3 translatable">Weather Map</h2>
    <div class="mb-3">
      <input type="text" id="mapSearch" class="form-control" placeholder="Search for a location...">
    </div>
    <div id="map"></div>
    <div id="routeInfo" class="mt-3 translatable"></div>
  </div>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA4GymxbXBaasNQd-Gl5XnztNBKs334kpM&libraries=places"></script>
  <script src="js/map.js"></script>
  <script src="js/translate.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initTranslation();
    });
  </script>
</body>
</html>
