<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WeatherHub — Weather Map</title>
  <meta name="description" content="Interactive weather map with real-time weather data for any location worldwide.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <div id="nav-mount"></div>

  <div class="page-container">
    <div class="animate-fade-in-up">
      <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:1rem;" class="translatable">Weather Map</h1>
      <input type="text" id="mapSearch" class="map-search-input" placeholder="Search for a location...">
      <div class="glass" style="padding:0;overflow:hidden;"><div id="map"></div></div>
      <div id="routeInfo" class="translatable" style="margin-top:0.75rem;font-size:0.85rem;color:var(--text-muted);"></div>
    </div>
  </div>

  <script type="module" src="/src/pages/map-page.js"></script>
</body>
</html>
