<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WeatherHub — Weather Map</title>
  <meta name="description" content="Interactive weather map with real-time weather data for any location worldwide.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav-glass" id="mainNav">
    <div class="nav-inner">
      <a class="nav-brand" href="index.html">
        <span class="nav-brand-icon"><i class="bi bi-cloud-sun-fill"></i></span>
        <span class="translatable">WeatherHub</span>
      </a>

      <ul class="nav-links" id="navLinks">
        <li><a class="translatable" href="index.html">Home</a></li>
        <li><a class="active translatable" href="map.html">Map</a></li>
        <li id="loginNavItem"><a class="translatable" href="login.html">Login</a></li>
        <li><a class="translatable" href="about.html">About</a></li>
      </ul>

      <div class="nav-right">
        <select id="languageSelect" class="nav-select" aria-label="Language">
          <option value="en" selected>English</option>
        </select>

        <div class="profile-dropdown" id="profileNavItem" style="display:none;">
          <div class="profile-avatar" id="profileDropdown" tabindex="0" role="button" aria-label="Profile menu" aria-expanded="false">
            <i class="bi bi-person"></i>
          </div>
          <div class="profile-menu" id="profileMenu">
            <a class="translatable" href="profile.html">Profile</a>
            <div class="profile-menu-divider"></div>
            <a class="translatable" href="#" id="logoutMenuBtn">Logout</a>
          </div>
        </div>

        <button class="nav-hamburger" id="navHamburger" aria-label="Toggle menu">
          <i class="bi bi-list"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Map Content -->
  <div class="page-container">
    <div class="animate-fade-in-up">
      <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:1rem;" class="translatable">Weather Map</h1>
      <input type="text" id="mapSearch" class="map-search-input" placeholder="Search for a location...">
      <div class="glass" style="padding:0;overflow:hidden;">
        <div id="map"></div>
      </div>
      <div id="routeInfo" class="translatable" style="margin-top:0.75rem;font-size:0.85rem;color:var(--text-muted);"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/map.js"></script>
  <script src="js/translate.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      initTranslation();
      initNav();
    });
    // Navbar scroll effect
    window.addEventListener('scroll', function() {
      var nav = document.getElementById('mainNav');
      if (window.scrollY > 20) nav.classList.add('scrolled');
      else nav.classList.remove('scrolled');
    });
  </script>
</body>
</html>
