<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile | Weather Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-bg">
  <a href="index.html" class="btn btn-link back-btn position-absolute top-0 start-0 m-3"><i class="bi bi-arrow-left"></i> Back</a>
  <div class="auth-container d-flex flex-column justify-content-center align-items-center min-vh-100">
    <div class="auth-card glass-card p-4 p-md-5 shadow-lg position-relative">
      <button class="btn btn-outline-secondary btn-sm position-absolute top-0 end-0 m-2" id="editProfileBtn" title="Edit Profile"><i class="bi bi-pencil"></i></button>
      <div class="text-center mb-4">
        <span class="auth-logo d-inline-flex align-items-center justify-content-center mb-2">
          <i class="bi bi-cloud-sun-fill"></i>
        </span>
        <h2 class="fw-bold mb-0 translatable">Profile</h2>
      </div>
      <div class="text-center mb-3">
        <div class="profile-pic mx-auto mb-2" id="profilePicContainer">
          <i class="bi bi-person" id="profilePicIcon"></i>
          <img id="profilePicImg" src="" alt="Profile Picture" style="display:none;">
        </div>
        <div class="welcome translatable" id="welcomeMsg">Welcome back!</div>
        <h4 class="fw-bold mb-1" id="profileName">Loading...</h4>
        <div class="text-muted" id="profileEmail"></div>
        <div class="text-muted" id="profilePhone"></div>
      </div>
      <button class="btn btn-primary w-100 mb-2 translatable" id="logoutBtn">Logout</button>
    </div>
    <!-- Edit Profile Modal -->
    <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="editProfileForm">
            <div class="modal-header">
              <h5 class="modal-title translatable" id="editProfileModalLabel">Edit Profile</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="editUsername" placeholder="Username" required>
                <label for="editUsername" class="translatable">Username</label>
              </div>
              <div class="form-floating mb-3">
                <input type="tel" class="form-control" id="editPhone" placeholder="Phone">
                <label for="editPhone" class="translatable">Phone</label>
              </div>
              <div id="editProfileMsg" class="text-center mt-2"></div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div class="glass-card tips-card mt-4 w-100 text-center">
      <h5 class="mb-2 translatable"><i class="bi bi-info-circle"></i> Weather Fun Fact</h5>
      <div id="weatherFact" class="translatable"></div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/translate.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initTranslation();
      // Load user info reliably using onAuthStateChanged
      // Show loading while fetching user info
      const nameEl = document.getElementById('profileName');
      const emailEl = document.getElementById('profileEmail');
      const phoneEl = document.getElementById('profilePhone');
      nameEl.textContent = 'Loading...';
      emailEl.textContent = '';
      phoneEl.textContent = '';
      let currentUserData = {};
      onAuthStateChanged(function(user) {
        if (user) {
          firebase.database().ref('users/' + user.uid).once('value').then(snapshot => {
            const data = snapshot.val();
            currentUserData = data || {};
            if (data && data.username) {
              nameEl.textContent = data.username;
            } else if (user.displayName) {
              nameEl.textContent = user.displayName;
            } else if (user.email) {
              nameEl.textContent = user.email.split('@')[0];
            } else {
              nameEl.textContent = 'User';
            }
            emailEl.textContent = (data && data.email) ? data.email : (user.email || '');
            phoneEl.textContent = (data && (data.phone || data.phoneno)) ? 'Phone: ' + (data.phone || data.phoneno) : '';
            // Pre-fill modal fields
            document.getElementById('editUsername').value = data && data.username ? data.username : '';
            document.getElementById('editPhone').value = data && (data.phone || data.phoneno) ? (data.phone || data.phoneno) : '';
          }).catch(() => {
            nameEl.textContent = user.displayName || (user.email ? user.email.split('@')[0] : 'User');
            emailEl.textContent = user.email || '';
            phoneEl.textContent = '';
          });
        } else {
          window.location.href = 'login.html';
        }
      });
      // Edit Profile Modal logic
      document.getElementById('editProfileBtn').onclick = function() {
        var modal = new bootstrap.Modal(document.getElementById('editProfileModal'));
        modal.show();
      };
      document.getElementById('editProfileForm').onsubmit = function(e) {
        e.preventDefault();
        const user = getCurrentUser();
        if (!user) return;
        const username = document.getElementById('editUsername').value.trim();
        const phone = document.getElementById('editPhone').value.trim();
        const msg = document.getElementById('editProfileMsg');
        msg.textContent = 'Saving...';
        firebase.database().ref('users/' + user.uid).update({ username: username, phone: phone, phoneno: null })
          .then(() => {
            msg.textContent = 'Profile updated!';
            msg.className = 'text-success text-center mt-2';
            nameEl.textContent = username;
            phoneEl.textContent = phone ? 'Phone: ' + phone : '';
            setTimeout(() => {
              var modal = bootstrap.Modal.getInstance(document.getElementById('editProfileModal'));
              modal.hide();
              msg.textContent = '';
            }, 1000);
          })
          .catch(() => {
            msg.textContent = 'Failed to update profile.';
            msg.className = 'text-danger text-center mt-2';
          });
      };
      document.getElementById('logoutBtn').onclick = function() {
        logoutUser(function() {
          window.location.href = 'login.html';
        });
      };
      // Fun fact
      const facts = [
        "Did you know? The highest temperature ever recorded on Earth was 56.7°C (134°F) in Death Valley, USA.",
        "Raindrops can fall at speeds of about 22 miles per hour!",
        "Snowflakes always have six sides.",
        "The coldest temperature ever recorded was -89.2°C (-128.6°F) in Antarctica.",
        "A bolt of lightning is five times hotter than the surface of the sun.",
        "The wettest place on Earth is Mawsynram, India, with 11,871mm of rain a year.",
        "Hurricanes can release energy equivalent to 10 atomic bombs per second.",
        "The fastest wind speed ever recorded was 253 mph during Tropical Cyclone Olivia.",
        "The Sahara Desert can reach freezing temperatures at night.",
        "Fog is actually a cloud that touches the ground."
      ];
      document.getElementById('weatherFact').textContent = facts[Math.floor(Math.random() * facts.length)];
    });
  </script>
</body>
</html>
