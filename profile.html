<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile — WeatherHub</title>
  <meta name="description" content="Manage your WeatherHub profile and account settings.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-bg">

  <a href="index.html" class="auth-back">
    <i class="bi bi-arrow-left"></i> Back
  </a>

  <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;">
    <div class="auth-card animate-fade-in-up" style="position:relative;">
      <button class="nav-icon-btn" id="editProfileBtn" title="Edit Profile" style="position:absolute;top:1rem;right:1rem;">
        <i class="bi bi-pencil"></i>
      </button>

      <div class="auth-logo" style="margin-bottom:0.5rem;">
        <i class="bi bi-cloud-sun-fill"></i>
      </div>
      <h1 class="auth-title translatable">Profile</h1>

      <div style="text-align:center;margin-bottom:1.5rem;">
        <div class="profile-pic" id="profilePicContainer">
          <i class="bi bi-person" id="profilePicIcon"></i>
          <img id="profilePicImg" src="" alt="Profile Picture" style="display:none;">
        </div>
        <div style="font-size:0.85rem;color:var(--color-accent-light);margin-bottom:0.75rem;" class="translatable" id="welcomeMsg">Welcome back!</div>
        <div class="profile-name" id="profileName">Loading...</div>
        <div class="profile-detail" id="profileEmail"></div>
        <div class="profile-detail" id="profilePhone"></div>
      </div>

      <button class="btn-primary translatable" id="logoutBtn" style="width:100%;padding:0.75rem;">Logout</button>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal-overlay" id="editProfileModal">
      <div class="modal-card">
        <form id="editProfileForm">
          <div class="modal-header">
            <h5 class="translatable" id="editProfileModalLabel">Edit Profile</h5>
            <button type="button" class="modal-close" id="editModalClose" aria-label="Close">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label for="editUsername" class="form-label translatable">Username</label>
              <input type="text" class="form-input" id="editUsername" placeholder="Username" required>
            </div>
            <div class="form-group">
              <label for="editPhone" class="form-label translatable">Phone</label>
              <input type="tel" class="form-input" id="editPhone" placeholder="Phone number">
            </div>
            <div id="editProfileMsg" class="auth-msg"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-secondary" id="editModalCancel">Cancel</button>
            <button type="submit" class="btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Weather Fun Fact -->
    <div class="glass weather-fact-card animate-fade-in-up animate-delay-1">
      <div style="font-weight:600;margin-bottom:0.5rem;" class="translatable"><i class="bi bi-info-circle"></i> Weather Fun Fact</div>
      <div id="weatherFact" class="translatable"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/translate.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      initTranslation();

      var nameEl = document.getElementById('profileName');
      var emailEl = document.getElementById('profileEmail');
      var phoneEl = document.getElementById('profilePhone');
      nameEl.textContent = 'Loading...';
      emailEl.textContent = '';
      phoneEl.textContent = '';
      var currentUserData = {};

      onAuthStateChanged(function(user) {
        if (user) {
          firebase.database().ref('users/' + user.uid).once('value').then(function(snapshot) {
            var data = snapshot.val();
            currentUserData = data || {};

            if (data && data.username) {
              nameEl.textContent = data.username;
            } else if (user.displayName) {
              nameEl.textContent = user.displayName;
            } else if (user.email) {
              nameEl.textContent = user.email.split('@')[0];
            } else {
              nameEl.textContent = 'User';
            }

            emailEl.textContent = (data && data.email) ? data.email : (user.email || '');
            // Unified: always read "phone" field (fallback to phoneno for legacy data)
            var phoneValue = (data && (data.phone || data.phoneno)) ? (data.phone || data.phoneno) : '';
            phoneEl.textContent = phoneValue ? 'Phone: ' + phoneValue : '';

            // Pre-fill modal fields
            document.getElementById('editUsername').value = data && data.username ? data.username : '';
            document.getElementById('editPhone').value = phoneValue;
          }).catch(function() {
            nameEl.textContent = user.displayName || (user.email ? user.email.split('@')[0] : 'User');
            emailEl.textContent = user.email || '';
            phoneEl.textContent = '';
          });
        } else {
          window.location.href = 'login.html';
        }
      });

      // Edit Profile Modal (custom, no Bootstrap)
      var editModal = document.getElementById('editProfileModal');
      function openEditModal() { editModal.classList.add('open'); }
      function closeEditModal() { editModal.classList.remove('open'); }

      document.getElementById('editProfileBtn').onclick = openEditModal;
      document.getElementById('editModalClose').onclick = closeEditModal;
      document.getElementById('editModalCancel').onclick = closeEditModal;
      editModal.addEventListener('click', function(e) {
        if (e.target === editModal) closeEditModal();
      });

      // Save profile — FIXED: always use "phone", remove legacy "phoneno"
      document.getElementById('editProfileForm').onsubmit = function(e) {
        e.preventDefault();
        var user = getCurrentUser();
        if (!user) return;
        var username = document.getElementById('editUsername').value.trim();
        var phone = document.getElementById('editPhone').value.trim();
        var msg = document.getElementById('editProfileMsg');
        msg.className = 'auth-msg';
        msg.textContent = 'Saving...';

        firebase.database().ref('users/' + user.uid).update({
          username: username,
          phone: phone,
          phoneno: null  // Clean up legacy field
        }).then(function() {
          msg.textContent = 'Profile updated!';
          msg.classList.add('success');
          nameEl.textContent = username;
          phoneEl.textContent = phone ? 'Phone: ' + phone : '';
          setTimeout(function() {
            closeEditModal();
            msg.textContent = '';
            msg.className = 'auth-msg';
          }, 1000);
        }).catch(function() {
          msg.textContent = 'Failed to update profile.';
          msg.classList.add('error');
        });
      };

      // Logout
      document.getElementById('logoutBtn').onclick = function() {
        logoutUser(function() {
          window.location.href = 'login.html';
        });
      };

      // Fun fact
      var facts = [
        "Did you know? The highest temperature ever recorded on Earth was 56.7\u00B0C (134\u00B0F) in Death Valley, USA.",
        "Raindrops can fall at speeds of about 22 miles per hour!",
        "Snowflakes always have six sides.",
        "The coldest temperature ever recorded was -89.2\u00B0C (-128.6\u00B0F) in Antarctica.",
        "A bolt of lightning is five times hotter than the surface of the sun.",
        "The wettest place on Earth is Mawsynram, India, with 11,871mm of rain a year.",
        "Hurricanes can release energy equivalent to 10 atomic bombs per second.",
        "The fastest wind speed ever recorded was 253 mph during Tropical Cyclone Olivia.",
        "The Sahara Desert can reach freezing temperatures at night.",
        "Fog is actually a cloud that touches the ground."
      ];
      document.getElementById('weatherFact').textContent = facts[Math.floor(Math.random() * facts.length)];
    });
  </script>
</body>
</html>
