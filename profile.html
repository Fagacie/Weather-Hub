<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile — WeatherHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="auth-bg">
  <a href="/index.html" class="auth-back"><i class="bi bi-arrow-left"></i> Back</a>
  <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;">
    <div class="auth-card animate-fade-in-up" style="position:relative;">
      <button class="nav-icon-btn" id="editProfileBtn" title="Edit Profile" style="position:absolute;top:1rem;right:1rem;"><i class="bi bi-pencil"></i></button>
      <div class="auth-logo" style="margin-bottom:0.5rem;"><i class="bi bi-cloud-sun-fill"></i></div>
      <h1 class="auth-title translatable">Profile</h1>
      <div style="text-align:center;margin-bottom:1.5rem;">
        <div class="profile-pic" id="profilePicContainer"><i class="bi bi-person" id="profilePicIcon"></i></div>
        <div style="font-size:0.85rem;color:var(--color-accent-light);margin-bottom:0.75rem;" class="translatable" id="welcomeMsg">Welcome back!</div>
        <div class="profile-name" id="profileName">Loading...</div>
        <div class="profile-detail" id="profileEmail"></div>
        <div class="profile-detail" id="profilePhone"></div>
      </div>
      <button class="btn-primary translatable" id="logoutBtn" style="width:100%;padding:0.75rem;">Logout</button>
    </div>

    <div class="modal-overlay" id="editProfileModal">
      <div class="modal-card">
        <form id="editProfileForm">
          <div class="modal-header">
            <h5 class="translatable" id="editProfileModalLabel">Edit Profile</h5>
            <button type="button" class="modal-close" id="editModalClose" aria-label="Close"><i class="bi bi-x-lg"></i></button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label for="editUsername" class="form-label translatable">Username</label>
              <input type="text" class="form-input" id="editUsername" placeholder="Username" required>
            </div>
            <div class="form-group">
              <label for="editPhone" class="form-label translatable">Phone</label>
              <input type="tel" class="form-input" id="editPhone" placeholder="Phone number">
            </div>
            <div id="editProfileMsg" class="auth-msg"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-secondary" id="editModalCancel">Cancel</button>
            <button type="submit" class="btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <div class="glass weather-fact-card animate-fade-in-up animate-delay-1">
      <div style="font-weight:600;margin-bottom:0.5rem;" class="translatable"><i class="bi bi-info-circle"></i> Weather Fun Fact</div>
      <div id="weatherFact" class="translatable"></div>
    </div>
  </div>
  <script type="module" src="/src/pages/profile.js"></script>
</body>
</html>
