# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: |
          if [ -n "$WEATHER_HUB_CONFIG_JS" ]; then
            mkdir -p js
            printf '%s' "$WEATHER_HUB_CONFIG_JS" > js/config.js
          fi
        env:
          WEATHER_HUB_CONFIG_JS: ${{ secrets.WEATHER_HUB_CONFIG_JS }}
      - run: npm ci
      - run: npm run build
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEATHER_HUB_5CCBB }}
      - run: npm install -g firebase-tools
      - run: firebase deploy --only hosting,functions,database --project weather-hub-5ccbb --non-interactive
