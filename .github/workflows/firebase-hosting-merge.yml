name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEATHER_HUB_5CCBB }}
      - run: npm install -g firebase-tools

      # Hosting and database rules are all the site needs for auth to work,
      # so they deploy first and independently of Cloud Functions.
      - name: Deploy hosting and database rules
        run: firebase deploy --only hosting,database --project weather-hub-5ccbb --non-interactive

      # Functions require the Blaze plan; a failure here must not block the site.
      - name: Deploy functions
        continue-on-error: true
        run: firebase deploy --only functions --project weather-hub-5ccbb --non-interactive
