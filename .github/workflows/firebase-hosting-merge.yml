name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEATHER_HUB_5CCBB }}
      - run: npm install -g firebase-tools

      # Hosting and database rules are the only targets; the app has no backend
      # so that everything stays within the free Spark plan.
      - name: Deploy hosting and database rules
        run: firebase deploy --only hosting,database --project weather-hub-5ccbb --non-interactive
