<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register | Weather Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="auth-bg">
  <a href="index.html" class="btn btn-link back-btn position-absolute top-0 start-0 m-3"><i class="bi bi-arrow-left"></i> Back</a>
  <div class="auth-container d-flex flex-column justify-content-center align-items-center min-vh-100">
    <div class="auth-card glass-card p-4 p-md-5 shadow-lg">
      <div class="text-center mb-4">
        <span class="auth-logo d-inline-flex align-items-center justify-content-center mb-2">
          <i class="bi bi-cloud-sun-fill"></i>
        </span>
        <h2 class="fw-bold mb-0 translatable">Sign Up</h2>
      </div>
      <form id="registerForm" autocomplete="off">
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="registerUsername" placeholder="Username" required>
          <label for="registerUsername" class="translatable">Username</label>
        </div>
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="registerEmail" placeholder="Email" required>
          <label for="registerEmail" class="translatable">Email address</label>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="registerPassword" placeholder="Password" required>
          <label for="registerPassword" class="translatable">Password</label>
        </div>
        <div class="form-floating mb-3">
          <input type="tel" class="form-control" id="registerPhone" placeholder="Phone (optional)">
          <label for="registerPhone" class="translatable">Phone (optional)</label>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 mt-2 translatable">Register</button>
        <div id="registerMsg" class="mt-3 translatable text-center"></div>
        <div class="text-center mt-3">
          <a href="login.html" class="translatable">Already have an account? Login</a>
        </div>
      </form>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/translate.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initTranslation();
      let isRegistering = false;
      onAuthStateChanged(function(user) {
        if (user && !isRegistering) window.location.href = 'index.html';
      });
      document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        isRegistering = true;
        const email = document.getElementById('registerEmail').value.trim();
        const password = document.getElementById('registerPassword').value;
        const username = document.getElementById('registerUsername').value.trim();
        const phone = document.getElementById('registerPhone').value.trim();
        const msg = document.getElementById('registerMsg');
        registerUser(email, password, username, phone, function(error) {
          if (error) {
            isRegistering = false;
            msg.textContent = error.message;
            msg.classList.add('text-danger');
          } else {
            msg.textContent = 'Registration successful!';
            msg.classList.remove('text-danger');
            msg.classList.add('text-success');
            setTimeout(() => window.location.href = 'index.html', 1200);
          }
        });
      });
    });
  </script>
</body>
</html>
