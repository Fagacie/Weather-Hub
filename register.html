<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up — WeatherHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="auth-bg">
  <a href="/index.html" class="auth-back"><i class="bi bi-arrow-left"></i> Back</a>
  <div class="auth-card animate-fade-in-up">
    <div class="auth-logo"><i class="bi bi-cloud-sun-fill"></i></div>
    <h1 class="auth-title translatable">Sign Up</h1>
    <form id="registerForm" autocomplete="off">
      <div class="form-group">
        <label for="registerUsername" class="form-label translatable">Username</label>
        <input type="text" class="form-input" id="registerUsername" placeholder="Your name" required>
      </div>
      <div class="form-group">
        <label for="registerEmail" class="form-label translatable">Email address</label>
        <input type="email" class="form-input" id="registerEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="registerPassword" class="form-label translatable">Password</label>
        <input type="password" class="form-input" id="registerPassword" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label for="registerPhone" class="form-label translatable">Phone (optional)</label>
        <input type="tel" class="form-input" id="registerPhone" placeholder="+60 12 345 6789">
      </div>
      <button type="submit" class="btn-primary translatable" style="width:100%;padding:0.75rem;margin-top:0.5rem;">Register</button>
      <div id="registerMsg" class="auth-msg"></div>
      <div class="auth-link"><a href="/login.html" class="translatable">Already have an account? Login</a></div>
    </form>
  </div>
  <script type="module" src="/src/pages/register.js"></script>
</body>
</html>
